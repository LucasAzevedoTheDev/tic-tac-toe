<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <script src="scripts.js" defer></script>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Oswald:wght@200..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
  <button class="dialog-button" type="button">Start</button>
  <dialog class="modal">
    <form action="" method="dialog" class="form">
      <div class="form-field">
        <label for="player1-input">Player 1 name:</label>
        <input class="player1-name" type="text" id="player1-input" required>
        <fieldset>
          <label for="player1-mark1">X
            <input type="radio" id="player1-mark1" name="player1-mark" value="X">
          </label>
          <label for="player1-mark2">O
            <input type="radio" id="player1-mark2" name="player1-mark" value="O">
          </label>
        </fieldset>
        <label for="player2-input">Player 2 name:</label>
        <input class="player2-name" type="text" id="player2-input" required>
        <fieldset>
          <label for="player2-mark1">X
            <input type="radio" id="player2-mark1" name="player2-mark" value="X">
          </label>
          <label for="player2-mark2">O
            <input type="radio" id="player2-mark2" name="player2-mark" value="O">
          </label>
        </fieldset>
      </div>
      <div class="buttons-field">
          <button class="start-button" type="submit">Start Game</button>
          <button class="close-button" type="button">Cancel</button>
        </div>
    </form>
  </dialog> 
  <div class="container"></div>
</body>
</html>
